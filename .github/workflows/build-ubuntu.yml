name: Build Ubuntu

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Ubuntu .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          ALSA_LIB="libasound2t64"
          if ! apt-cache show "$ALSA_LIB" >/dev/null 2>&1; then
            ALSA_LIB="libasound2"
          fi
          sudo apt-get install -y \
            "$ALSA_LIB" \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libxext6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libwayland-client0

      - name: Publish Linux x64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish VoiceInput/VoiceInput.csproj \
            -c Release \
            -f net10.0 \
            -r linux-x64 \
            --self-contained true \
            -p:DebugType=none \
            -p:EnableWindowsTargeting=true \
            -p:Version="$VERSION"

      - name: Package .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build/linux/build-deb.sh "$VERSION"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/voiceinput_*_amd64.deb
