name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Build Ubuntu .deb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          ALSA_LIB="libasound2t64"
          if ! apt-cache show "$ALSA_LIB" >/dev/null 2>&1; then
            ALSA_LIB="libasound2"
          fi
          sudo apt-get install -y \
            "$ALSA_LIB" \
            libfontconfig1 \
            libice6 \
            libsm6 \
            libx11-6 \
            libxext6 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libwayland-client0

      - name: Publish Linux x64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish VoiceInput/VoiceInput.csproj \
            -c Release \
            -f net10.0 \
            -r linux-x64 \
            --self-contained true \
            -p:DebugType=none \
            -p:EnableWindowsTargeting=true \
            -p:Version="$VERSION"

      - name: Package .deb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build/linux/build-deb.sh "$VERSION"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInput-deb
          path: dist/VoiceInput_*_amd64.deb

  windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          ./build/windows/build.ps1 -Version $version

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceInput-exe
          path: VoiceInput_Setup_v*.exe

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - linux
      - windows

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes || true

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/VoiceInput-deb/VoiceInput_*_amd64.deb
            release-artifacts/VoiceInput-exe/VoiceInput_Setup_v*.exe
